<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>클로 머신 관리자</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f4f1ec;color:#29241f;margin:0;padding:28px}
main{max-width:1080px;margin:auto}.card{background:#fff;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 3px 14px #0001}
h1,h2{font-weight:700}img{width:260px;max-width:100%}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:14px;vertical-align:top}.muted{color:#796f65}.ok{color:#136f38;font-weight:700}.warn{color:#a35c00;font-weight:700}.done{color:#777}.pill{display:inline-block;border-radius:999px;padding:3px 9px;background:#f1ece4;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{border-radius:14px;background:#f7f1e8;padding:16px}.metric b{display:block;font-size:26px;margin-top:6px}
</style>
</head>
<body><main>
<h1>클로 머신 관리자</h1>
<div class="card"><h2>오늘의 운영자 인증 QR</h2><div id="auth"></div></div>
<div class="card"><h2>운영 상태</h2><div id="summary"></div></div>
<div class="card"><h2>상품별 재고 현황</h2><div id="inventory"></div></div>
<div class="card"><h2>금 당첨 슬롯</h2><div id="slots"></div></div>
<div class="card"><h2>최근 당첨 및 수령</h2><div id="claims"></div></div>
</main>
<script>
const data=__ADMIN_DATA__;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=(v)=>{
  if(!v)return '';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return esc(v);
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:data.timezone||'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).map(p=>[p.type,p.value]));
  return `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
};
const scopeLabel=(scope)=>scope==='daily'?'매일':'전시 기간';
const gradeLabel=(grade)=>grade==='gold'?'금':'은';
document.querySelector('#auth').innerHTML=data.authUrl?`<img src="/qr?text=${encodeURIComponent(data.authUrl)}"><p class="muted">스캔하면 비밀번호 없이 이 기기에서 운영툴에 바로 접속됩니다. 운영 시작 1시간 전부터 운영 종료까지 유효합니다.</p>`:'<p>현재 인증 QR 발급 시간이 아닙니다.</p>';
document.querySelector('#summary').innerHTML=`<div class="summary"><div class="metric">온라인 키오스크<b>${data.summary?.onlineKiosks??0}</b></div><div class="metric">진행 중 세션<b>${data.summary?.activeSessions??0}</b></div><div class="metric">미수령 보상<b>${data.summary?.pendingClaims??0}</b></div></div>`;
document.querySelector('#inventory').innerHTML=`<table><tr><th>등급</th><th>상품</th><th>범위</th><th>지급</th><th>남은 수량</th></tr>${data.inventory.map(x=>`<tr><td><span class="pill">${gradeLabel(x.grade)}</span></td><td>${esc(x.name)}</td><td>${scopeLabel(x.scope)}<br><span class="muted">${esc(x.periodKey)}</span></td><td>${x.awarded} / ${x.total}</td><td class="${x.remaining>0?'ok':'done'}">${x.remaining}</td></tr>`).join('')}</table>`;
document.querySelector('#slots').innerHTML=`<table><tr><th>시작</th><th>종료</th><th>확률</th><th>상태</th></tr>${data.slots.map(x=>`<tr><td>${dt(x.start_at)}</td><td>${dt(x.end_at)}</td><td>${x.p_start} -> ${x.p_end}</td><td>${x.consumed_at?'<span class="done">소비됨</span>':'<span class="warn">대기</span>'}</td></tr>`).join('')}</table>`;
document.querySelector('#claims').innerHTML=`<table><tr><th>등급</th><th>상품</th><th>키오스크</th><th>당첨 시각</th><th>수령</th></tr>${data.claims.map(x=>`<tr><td>${gradeLabel(x.result)}</td><td>${esc(x.prize_name||x.result)}</td><td>${esc(x.kiosk_id)}</td><td>${dt(x.visible_at)}</td><td>${x.claimed_at?'완료 '+dt(x.claimed_at):'미수령'}</td></tr>`).join('')}</table>`;
</script>
</body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gacha Mobile Page Preview</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#17110d;color:#f7ead0;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:24px;padding:24px}
    aside{position:sticky;top:24px;align-self:start;padding:18px;border:1px solid rgba(255,220,160,.25);border-radius:18px;background:rgba(45,28,18,.82)}
    h1{font-size:20px;margin:0 0 8px}
    p{font-size:13px;line-height:1.55;color:#d9c09b;margin:0 0 16px}
    button{width:100%;margin:5px 0;padding:12px 14px;border:0;border-radius:12px;background:#f1c27a;color:#26180f;font-weight:800;cursor:pointer}
    button:hover{filter:brightness(1.08)}
    button.active{background:#fff2c5}
    .stage{display:flex;align-items:flex-start;justify-content:center;min-width:0}
    .phone{width:min(420px,100%);aspect-ratio:970/2158;border:10px solid #0d0b09;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 24px 80px rgba(0,0,0,.55)}
    iframe{display:block;width:100%;height:100%;border:0;background:#000}
    code{font-family:ui-monospace,Consolas,monospace;color:#fff2c5}
    @media (max-width:760px){body{grid-template-columns:1fr;padding:14px}aside{position:relative;top:0}.stage{align-items:center}.phone{width:min(390px,100%)}}
  </style>
</head>
<body>
  <aside>
    <h1>모바일 화면 미리보기</h1>
    <p>실제 서버 당첨 없이 각 화면을 확인하는 테스트 페이지입니다. iframe은 <code>/play?preview=...</code>를 사용합니다.</p>
    <button data-preview="start" class="active">타이틀</button>
    <button data-preview="playing">컨트롤러</button>
    <button data-preview="resolving">결과 대기</button>
    <button data-preview="artifact">비당첨 유물</button>
    <button data-preview="silver">은 당첨</button>
    <button data-preview="gold">금 당첨</button>
  </aside>
  <main class="stage">
    <div class="phone"><iframe id="previewFrame" src="/play?preview=start" title="mobile preview"></iframe></div>
  </main>
  <script>
    const frame=document.querySelector('#previewFrame');
    document.querySelectorAll('button[data-preview]').forEach(button=>{
      button.addEventListener('click',()=>{
        document.querySelectorAll('button[data-preview]').forEach(x=>x.classList.toggle('active',x===button));
        frame.src=`/play?preview=${encodeURIComponent(button.dataset.preview)}`;
      });
    });
  </script>
</body>
</html>

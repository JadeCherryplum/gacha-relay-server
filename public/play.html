<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>백제 왕실 황금보물을 찾아라!</title>
  <style>
    @font-face{font-family:GapyeongWave;src:url('/gui/Font/GapyeongWave.otf') format('opentype');font-display:swap}
    @font-face{font-family:GapyeongHanseokB;src:url('/gui/Font/GapyeongHanseokbongB.otf') format('opentype');font-display:swap}
    @font-face{font-family:GapyeongHanseokR;src:url('/gui/Font/GapyeongHanseokbongR.otf') format('opentype');font-display:swap}
    @font-face{font-family:GapyeongHanseokL;src:url('/gui/Font/GapyeongHanseokbongL.otf') format('opentype');font-display:swap}
    @font-face{font-family:ChosunGs;src:url('/gui/Font/ChosunGs.TTF') format('truetype');font-display:swap}
    @font-face{font-family:ChosunGsHanja;src:url('/gui/Font/ChosunGs.TTF') format('truetype');unicode-range:U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF;font-display:swap}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;min-height:100%;font-family:ChosunGs,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#2a130d;color:#f7ead0}
    body{min-height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#2a130d url('/gui/Bg.png') center/cover no-repeat}
    button{font:inherit;border:0;background:transparent;padding:0;margin:0;color:inherit;touch-action:none}
    .hidden{display:none!important}
    .screen{position:relative;width:100%;height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .content{position:relative;width:min(100vw,calc(100dvh * 970 / 2158));height:min(100dvh,calc(100vw * 2158 / 970));margin:0 auto;overflow:hidden}
    .fill-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

    .start-title{position:absolute;top:13%;left:50%;width:79%;transform:translateX(-50%);z-index:2}
    .title-machine{position:absolute;top:29%;left:49%;width:66%;max-height:52%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 16px 28px rgba(0,0,0,.35));z-index:2}
    .title-character{position:absolute;left:72%;bottom:18%;width:43%;transform:translateX(-50%);z-index:3;pointer-events:none}
    .start-button{position:absolute;left:50%;bottom:11.2%;width:66%;max-width:640px;transform:translateX(-50%);z-index:4}
    .start-button img,.control-button img,.grab-button img{display:block;width:100%;height:auto;pointer-events:none}
    .start-button:active{transform:translateX(-50%) scale(.95)}
    .control-button:active,.grab-button:active,.pressed{transform:scale(.95)}

    .play-timer{position:absolute;top:13.2%;left:50%;width:50.2%;max-width:440px;transform:translateX(-50%)}
    .timer-bg{display:block;width:100%;height:auto}
    .timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:.2em;font-family:GapyeongHanseokB,serif;font-size:clamp(28px,8vw,46px);letter-spacing:.04em;color:#fff0c2;text-shadow:0 2px 5px rgba(0,0,0,.45)}
    .pad{position:absolute;top:30.5%;left:50%;width:77%;max-width:760px;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:url('/gui/bg_center.png') center/76% 76% no-repeat;filter:drop-shadow(0 18px 28px rgba(0,0,0,.32))}
    .control-button{position:absolute;width:32%;height:32%;display:flex;align-items:center;justify-content:center;transition:filter .08s ease,opacity .12s ease}
    .control-button:disabled,.grab-button:disabled{opacity:.45;filter:grayscale(.15)}
    .control-button.up{top:0;left:34%}
    .control-button.left{top:34%;left:0}
    .control-button.right{top:34%;right:0}
    .control-button.down{bottom:0;left:34%}
    .grab-button{position:absolute;left:50%;bottom:9.7%;width:45%;max-width:450px;transform:translateX(-50%);transition:filter .08s ease,opacity .12s ease}
    .grab-button:active{transform:translateX(-50%) scale(.95)}
    .status-text{position:absolute;left:8%;right:8%;bottom:2.3%;text-align:center;font-size:13px;color:#e8caa0;text-shadow:0 1px 3px #000}
    .start-status{display:none}

    .result-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:10.5% 6% 5%}
    .relic-frame{position:relative;width:62%;height:auto;aspect-ratio:1162/1810;margin-top:0;display:flex;align-items:center;justify-content:center;background:center/100% 100% no-repeat;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
    .relic-frame.normal{background-image:url('/gui/img_info.png')}
    .relic-frame.empty{background-image:none;min-height:24%;aspect-ratio:auto}
    .relic-frame.empty .relic-img{display:none}
    .relic-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28))}
    .name-box{position:relative;width:88%;min-height:52px;margin:5.5% auto 1.7%;display:flex;align-items:center;justify-content:center;padding:8px 22px;color:#fff2cc;font-family:ChosunGsHanja,GapyeongHanseokR,serif;font-size:clamp(18px,5.2vw,30px);line-height:1.15;text-shadow:0 2px 4px rgba(0,0,0,.45)}
    .result-line{width:78%;height:auto;margin:1% auto 3%}
    .description{width:86%;max-height:27%;overflow:auto;margin:0 auto;color:#f2dfbd;font-family:ChosunGsHanja,GapyeongHanseokL,serif;font-size:clamp(13px,3.5vw,18px);line-height:1.62;word-break:keep-all;text-shadow:0 1px 3px rgba(0,0,0,.4)}

    .prize-stage{position:absolute;inset:0;overflow:hidden;background:#2a130d}
    .prize-bg{z-index:1}
    .prize-result{z-index:2;object-fit:contain}
    .prize-character{position:absolute;left:50%;bottom:4.4%;width:61%;max-height:45%;object-fit:contain;transform:translateX(-50%);z-index:3;pointer-events:none}
    .prize-confetti{z-index:4}
    .claim-qr{position:absolute;left:18.4%;top:21.5%;width:18.8%;aspect-ratio:1;z-index:5;background:#fff;padding:.8%;box-shadow:0 4px 10px rgba(0,0,0,.26)}
    .claim-prize-name{position:absolute;left:41%;right:8%;top:22%;z-index:5;color:#fff7e4;font-family:ChosunGsHanja,GapyeongHanseokR,serif;font-size:clamp(16px,4.8vw,27px);line-height:1.22;text-align:left;text-shadow:0 2px 5px rgba(0,0,0,.45);word-break:keep-all}

    .notice-panel{margin:auto;width:86%;padding:28px 22px;border-radius:22px;background:rgba(33,15,9,.82);border:1px solid rgba(255,225,170,.28);text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
    .notice-panel h1{margin:0 0 12px;font-family:GapyeongHanseokB,serif;font-size:24px;color:#fff0c2}
    .notice-panel p{margin:0;color:#ead1a7;line-height:1.6}
    .spinner{width:54px;height:54px;border:5px solid rgba(255,234,190,.25);border-top-color:#f7d378;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 22px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-height:720px){.claim-qr{width:17%;top:21.8%}.claim-prize-name{font-size:clamp(14px,4vw,22px)}}
  </style>
</head>
<body>
  <section id="start" class="screen hidden">
    <div class="content">
      <img class="start-title" src="/gui/Title.png" alt="백제 왕실 황금보물을 찾아라!">
      <img class="title-machine" src="/gui/Title_img.png" alt="클로 머신">
      <img class="title-character" src="/gui/sequence/title.webp" alt="">
      <button id="startButton" class="start-button" aria-label="뽑기 시작하기"><img src="/gui/Btn_start.png" alt="뽑기 시작하기"></button>
      <div id="startStatus" class="status-text start-status"></div>
    </div>
  </section>

  <section id="playing" class="screen hidden">
    <div class="content">
      <div class="play-timer"><img class="timer-bg" src="/gui/Timer_box.png" alt=""><div id="timer" class="timer-text">01:00</div></div>
      <div class="pad" aria-label="이동 컨트롤러">
        <button class="control-button up" data-action="up" aria-label="위"><img src="/gui/Btn_up.png" alt="위"></button>
        <button class="control-button left" data-action="left" aria-label="왼쪽"><img src="/gui/Btn_left.png" alt="왼쪽"></button>
        <button class="control-button right" data-action="right" aria-label="오른쪽"><img src="/gui/Btn_right.png" alt="오른쪽"></button>
        <button class="control-button down" data-action="down" aria-label="아래"><img src="/gui/Btn_down.png" alt="아래"></button>
      </div>
      <button id="grab" class="grab-button" aria-label="잡기"><img src="/gui/Btn_catch.png" alt="잡기"></button>
      <div id="playStatus" class="status-text">연결 중...</div>
    </div>
  </section>

  <section id="resolving" class="screen hidden">
    <div class="notice-panel"><div class="spinner"></div><h1>결과 확인 중</h1><p>클로가 움직이고 있습니다.<br>잠시만 기다려 주세요.</p></div>
  </section>

  <section id="finished" class="screen hidden">
    <div class="content">
      <div id="artifactResult" class="result-wrap">
        <div id="relicFrame" class="relic-frame normal"><img id="relicImage" class="relic-img" alt="유물 이미지"></div>
        <div id="resultTitle" class="name-box">결과</div>
        <img class="result-line" src="/gui/Line.png" alt="">
        <div id="resultMessage" class="description"></div>
      </div>
      <div id="prizeResult" class="prize-stage hidden">
        <img class="fill-img prize-bg" src="/gui/Bg.png" alt="">
        <img class="fill-img prize-result" src="/gui/Result.png" alt="">
        <img id="prizeCharacter" class="prize-character" src="/gui/sequence/1.webp" alt="">
        <img class="fill-img prize-confetti" src="/gui/sequence/confetti.webp" alt="">
        <img id="claimQr" class="claim-qr" alt="상품 수령 QR">
        <div id="claimPrizeName" class="claim-prize-name"></div>
      </div>
    </div>
  </section>

  <section id="notice" class="screen">
    <div class="notice-panel"><h1 id="noticeTitle">연결 중...</h1><p id="noticeMessage">잠시만 기다려 주세요.</p></div>
  </section>

  <script>
  (()=>{
    const HOLD_MS=100;
    const params=new URLSearchParams(location.search);
    const playToken=params.get('token');
    const resultToken=params.get('result');
    const screens=['start','playing','resolving','finished','notice'];
    const show=id=>screens.forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
    const notice=(title,message)=>{document.querySelector('#noticeTitle').textContent=title;document.querySelector('#noticeMessage').textContent=message;show('notice')};
    const fmt=seconds=>{const s=Math.max(0,Number(seconds)||0);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
    const buttons=[...document.querySelectorAll('.control-button')];
    const grab=document.querySelector('#grab');
    const startButton=document.querySelector('#startButton');
    const held=new Map();
    let ws=null,resultUrl=null,finished=false,artifactData=null,bound=false,started=false,startDeadlineTimer=null;

    const prizeSequenceById={
      usb:1,
      wooden_pillow:2,
      gyeyangbae:3,
      handkerchief:4,
      ceramic_lunchbox:5,
      lucy_doll:6,
      gold_crystal_led_tower:7
    };

    function stop(action){const x=held.get(action);if(!x)return;clearInterval(x.timer);x.button.classList.remove('pressed');held.delete(action);send(action,'stop')}
    function stopAll(){[...held.keys()].forEach(stop)}
    function send(action,phase){if(ws?.readyState===1)ws.send(JSON.stringify(phase?{type:'input',action,phase}:{type:'input',action}))}
    function setControlsDisabled(disabled){buttons.forEach(b=>b.disabled=disabled);grab.disabled=disabled}
    function disable(){stopAll();setControlsDisabled(true)}
    function clearStartDeadline(){if(startDeadlineTimer){clearTimeout(startDeadlineTimer);startDeadlineTimer=null}}
    function bind(){
      if(bound)return;
      bound=true;
      buttons.forEach(b=>{
        const a=b.dataset.action;
        const start=e=>{
          e.preventDefault();
          if(held.has(a)||b.disabled)return;
          b.classList.add('pressed');
          send(a,'start');
          held.set(a,{button:b,timer:setInterval(()=>send(a,'hold'),HOLD_MS)});
        };
        ['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,start,{passive:false}));
        ['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>b.addEventListener(ev,()=>stop(a),{passive:false}));
      });
      grab.addEventListener('click',()=>{if(grab.disabled)return;disable();send('grab')});
    }
    async function artifactByIndex(index){
      if(index===null||index===undefined)return null;
      if(!artifactData){
        try{
          const r=await fetch('/artifacts.json',{cache:'no-store'});
          artifactData=r.ok?await r.json():{artifacts:[]};
        }catch{artifactData={artifacts:[]}}
      }
      return (artifactData.artifacts||[]).find(x=>Number(x.index)===Number(index))||null;
    }
    function relicImageUrl(index){
      const n=Number(index);
      if(!Number.isFinite(n))return '/gui/relic/01.png';
      return `/gui/relic/${String(n+1).padStart(2,'0')}.png`;
    }
    function isPrize(data){return Boolean(data?.claimUrl)&&(data.result==='gold'||data.result==='silver')}
    function prizeSequenceIndex(data){
      if(prizeSequenceById[data?.prizeId])return prizeSequenceById[data.prizeId];
      return data?.result==='gold'?7:1;
    }
    async function showResult(data){
      finished=true;
      disable();
      show('finished');
      const artifactPanel=document.querySelector('#artifactResult');
      const prizePanel=document.querySelector('#prizeResult');
      const prize=isPrize(data);
      artifactPanel.classList.toggle('hidden',prize);
      prizePanel.classList.toggle('hidden',!prize);

      if(prize){
        const index=prizeSequenceIndex(data);
        document.querySelector('#prizeCharacter').src=`/gui/sequence/${index}.webp`;
        document.querySelector('#claimPrizeName').textContent=data.prizeName||'당첨 상품';
        document.querySelector('#claimQr').src=`/qr?text=${encodeURIComponent(data.claimUrl)}`;
        return;
      }

      const artifact=await artifactByIndex(data.artifactIndex);
      const hasArtifact=Boolean(artifact);
      const frame=document.querySelector('#relicFrame');
      const img=document.querySelector('#relicImage');
      const title=document.querySelector('#resultTitle');
      const message=document.querySelector('#resultMessage');
      frame.className=`relic-frame ${hasArtifact?'normal':'empty'}`;
      if(hasArtifact){
        img.src=relicImageUrl(data.artifactIndex);
        img.alt=artifact.name;
      }else{
        img.removeAttribute('src');
        img.alt='';
      }
      title.textContent=artifact?.name || '아쉽지만 실패했습니다';
      message.textContent=artifact?.description || '다음 기회에 다시 도전해 주세요.';
    }
    async function recover(urlToken){
      show('resolving');
      const poll=async()=>{
        try{
          const r=await fetch(`/api/results/${encodeURIComponent(urlToken)}`,{cache:'no-store'});
          const data=await r.json();
          if(r.status===200)return showResult(data);
          if(r.status===202)return setTimeout(poll,1000);
          notice('만료된 결과 링크','오늘 운영 시간이 종료되었거나 상품 수령이 완료되었습니다.');
        }catch{setTimeout(poll,1500)}
      };
      poll();
    }
    function connect(){
      const scheme=location.protocol==='https:'?'wss:':'ws:';
      ws=new WebSocket(`${scheme}//${location.host}/play?token=${encodeURIComponent(playToken)}`);
      ws.onmessage=e=>{
        let m;
        try{m=JSON.parse(e.data)}catch{return}
        if(m.type==='claimed'){
          show('start');
          startButton.disabled=false;
          clearStartDeadline();
          startDeadlineTimer=setTimeout(()=>notice('시작 시간이 만료되었습니다','키오스크에서 새 QR 코드를 다시 스캔해 주세요.'),(Number(m.startTimeoutSeconds)||30)*1000+800);
        }else if(m.type==='session_started'){
          clearStartDeadline();
          resultUrl=m.resultUrl;
          history.replaceState(null,'',m.resultUrl);
          document.querySelector('#timer').textContent=fmt(m.duration);
          document.querySelector('#playStatus').textContent='조작 가능';
          show('playing');
          setControlsDisabled(false);
          bind();
        }else if(m.type==='tick'){
          document.querySelector('#timer').textContent=fmt(m.remaining);
        }else if(m.type==='resolving'){
          disable();
          show('resolving');
        }else if(m.type==='result'){
          showResult(m);
        }else if(m.type==='error'){
          notice('처리 오류','키오스크에서 새 QR 코드를 다시 스캔해 주세요.');
        }else if(m.type==='session_ended'&&!finished&&m.reason!=='completed'){
          notice('플레이 종료','키오스크에서 새 QR 코드를 다시 스캔해 주세요.');
        }
      };
      ws.onclose=()=>{
        clearStartDeadline();
        if(finished)return;
        const token=resultUrl?new URL(resultUrl).searchParams.get('result'):null;
        if(token)recover(token);
        else notice('연결이 종료되었습니다','키오스크에서 새 QR 코드를 다시 스캔해 주세요.');
      };
    }
    setControlsDisabled(true);
    if(resultToken&&!playToken){recover(resultToken);return}
    if(!playToken){notice('잘못된 접속','키오스크의 QR 코드를 다시 스캔해 주세요.');return}
    startButton.disabled=true;
    show('notice');
    connect();
    startButton.addEventListener('click',()=>{if(started||ws?.readyState!==1)return;started=true;startButton.disabled=true;ws.send(JSON.stringify({type:'start'}))});
  })();
  </script>
</body>
</html>
